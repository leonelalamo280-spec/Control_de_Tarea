<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear actividad | Control de Tarea</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><script type="module" src="js/main.js"></script></head>
<body class="form-page"><main class="form-page-shell"><a class="back-link" href="index.html">← Volver al panel</a><div class="form-page-brand"><img src="img/logo-control-de-tarea.jpg" alt="Logo"><div><b>CONTROL DE TAREA</b><small>GESTIÓN DOCENTE</small></div></div><div class="page-card"><span class="eyebrow">NUEVA ACTIVIDAD</span><h1>Crear tarea o examen</h1><p class="muted">Completá los datos para publicar una actividad para tus alumnos.</p><form id="create-form" class="form-grid"><label class="full">Título<input name="title" required maxlength="90" placeholder="Ej. Trabajo práctico: programación"></label><label>Tipo<select name="type"><option>Tarea</option><option>Examen</option><option>Trabajo práctico</option></select></label><label>Materia<select name="subject"><option>Programación</option><option>Matemática</option><option>Lengua y Literatura</option><option>Inglés</option><option>Electrónica</option><option>Autogestión</option></select></label><label>Año<select name="year"><option>1° año</option><option>2° año</option><option>3° año</option><option>4° año</option><option>5° año</option><option>6° año</option></select></label><label>División<select name="division"><option>1° división</option><option>2° división</option><option>3° división</option></select></label><label class="full">Fecha y hora límite<input name="due" type="datetime-local" required></label><label class="full">Descripción<textarea name="description" rows="5" required placeholder="Escribí las instrucciones de la actividad..."></textarea></label><div class="form-actions full"><button type="button" class="secondary-btn" onclick="location.href='index.html'">Cancelar</button><button class="primary-btn" type="submit">Publicar actividad →</button></div></form></div></main><div class="toast" id="toast"></div></body></html>
